<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">Login</h2>
                <form method="post" action="/myapp/login_post/">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" name="username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>
                <div class="text-center mt-3">
                    <a href="/myapp/signupclient_get/">sign up</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Material Hub | Sign in to Access</title>
    <!-- Google Fonts + Material Icons + Font Awesome (for extra polish) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <!-- Bootstrap 5 minimal CSS (lightweight but compatible) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        /* subtle animated gradient overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
        }

        /* main card container - material elevation */
        .material-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 8px 18px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .material-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.3);
        }

        /* header section with brand */
        .hub-header {
            background: #1e2b3c;
            padding: 1.8rem 2rem 1.5rem;
            text-align: center;
            position: relative;
        }

        .hub-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 2rem;
            right: 2rem;
            height: 3px;
            background: linear-gradient(90deg, #ffb347, #ff8c00, #f39c12);
            border-radius: 3px;
        }

        .logo-icon {
            font-size: 3.2rem;
            color: #ffb347;
            background: rgba(255,255,255,0.1);
            width: 70px;
            height: 70px;
            line-height: 70px;
            text-align: center;
            border-radius: 28px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .logo-icon i {
            font-size: 2.8rem;
        }

        .hub-header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: white;
            margin: 0;
            line-height: 1.2;
        }

        .hub-header p {
            color: #cbdbe6;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            font-weight: 400;
        }

        /* form body */
        .form-body {
            padding: 2rem 2rem 1.8rem;
        }

        /* modern material floating labels (but using standard with style) */
        .input-group-material {
            margin-bottom: 1.8rem;
            position: relative;
        }

        .input-group-material .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #8e9aaf;
            font-size: 1.2rem;
            transition: color 0.2s;
            z-index: 2;
            pointer-events: none;
        }

        .form-control-material {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            font-size: 1rem;
            font-weight: 500;
            background-color: #f8fafd;
            border: 1.5px solid #e2e8f0;
            border-radius: 1.2rem;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
        }

        .form-control-material:focus {
            outline: none;
            border-color: #ff8c42;
            box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.15);
            background-color: #ffffff;
        }

        .form-control-material::placeholder {
            color: #a0b3c9;
            font-weight: 400;
            font-size: 0.9rem;
        }

        /* label style */
        .floating-label {
            position: absolute;
            left: 2.8rem;
            top: -0.65rem;
            background: white;
            padding: 0 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #ff8c42;
            letter-spacing: 0.3px;
            border-radius: 20px;
            transition: 0.1s;
            pointer-events: none;
            z-index: 3;
        }

        /* special for better accessibility: hide label by default? we add via pseudo but we'll use actual label with position */
        /* alternative approach: add small badge style, but we'll keep it clean */
        .label-badge {
            position: absolute;
            left: 2.8rem;
            top: -0.6rem;
            background: white;
            padding: 0 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #ff8c42;
            border-radius: 12px;
            letter-spacing: 0.3px;
            pointer-events: none;
            z-index: 2;
        }

        /* login button material style */
        .btn-material {
            background: linear-gradient(95deg, #1e2b3c 0%, #2c3e4e 100%);
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            color: white;
            width: 100%;
            transition: all 0.25s;
            box-shadow: 0 8px 14px -6px rgba(30, 43, 60, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-material i {
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .btn-material:hover {
            background: linear-gradient(95deg, #243b4e 0%, #1f2f3c 100%);
            transform: scale(1.01);
            box-shadow: 0 12px 20px -8px rgba(0,0,0,0.35);
        }

        .btn-material:hover i {
            transform: translateX(4px);
        }

        .btn-material:active {
            transform: scale(0.98);
        }

        /* signup link area */
        .signup-cta {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 0.8rem;
            border-top: 1px solid #edf2f7;
        }

        .signup-link {
            color: #ff8c42;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .signup-link i {
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .signup-link:hover {
            color: #e67e22;
            text-decoration: none;
            gap: 8px;
        }

        .signup-link:hover i {
            transform: translateX(3px);
        }

        /* extra decorative elements */
        .decor-shape {
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255,140,66,0.08) 0%, rgba(255,140,66,0) 70%);
            border-radius: 50%;
            bottom: -60px;
            right: -60px;
            pointer-events: none;
            z-index: -1;
        }

        .decor-shape-2 {
            top: -70px;
            left: -70px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(30,43,60,0.05) 0%, rgba(30,43,60,0) 70%);
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        /* demo toast or message (optional hidden flash but keep clean) */
        .alert-material {
            border-radius: 1rem;
            border: none;
            font-size: 0.85rem;
            background: #fff4e8;
            color: #c26b2c;
            border-left: 4px solid #ff8c42;
            margin-bottom: 1.5rem;
            display: none;
        }

        /* responsive adjustments */
        @media (max-width: 520px) {
            .form-body {
                padding: 1.5rem;
            }
            .hub-header {
                padding: 1.4rem 1.2rem;
            }
            .logo-icon {
                width: 55px;
                height: 55px;
                font-size: 2.2rem;
            }
        }

        /* CSRF token note: form action is kept original, no changes */
        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            transition: background-color 0s 600000s, color 0s 600000s;
        }
    </style>
</head>
<body>
    <div class="material-card position-relative">
        <!-- decorative abstract shapes -->
        <div class="decor-shape"></div>
        <div class="decor-shape-2"></div>

        <!-- Header: Material Hub branding -->
        <div class="hub-header">
            <div class="logo-icon">
                <i class="fas fa-cubes"></i>
            </div>
            <h1>Material Hub</h1>
            <p>Centralized resource & design ecosystem</p>
        </div>

        <!-- Form section -->
        <div class="form-body">
            <!-- optional alert placeholder for future backend messages (kept hidden by default) -->
            <div id="liveAlert" class="alert alert-material d-none" role="alert">
                <i class="fas fa-info-circle me-1"></i> <span id="alertMsg"></span>
            </div>

            <form method="post" action="/myapp/login_post/" id="loginForm">
                {% csrf_token %}
                <!-- Username field with material design accent -->
                <div class="input-group-material">
                    <span class="input-icon"><i class="material-icons-round">person_outline</i></span>
                    <input type="text" class="form-control-material" name="username" id="username" placeholder=" " autocomplete="username" required>
                    <span class="label-badge">Username</span>
                </div>

                <!-- Password field -->
                <div class="input-group-material">
                    <span class="input-icon"><i class="material-icons-round">lock_outline</i></span>
                    <input type="password" class="form-control-material" name="password" id="password" placeholder=" " autocomplete="current-password" required>
                    <span class="label-badge">Password</span>
                    <!-- optional toggle visibility eye (nice UX) -->
                    <span class="toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: #8e9aaf; z-index: 5;">
                        <i class="far fa-eye-slash" id="toggleIcon"></i>
                    </span>
                </div>

                <!-- Extra row: remember me? (optional material hint) -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberCheck" style="border-radius: 5px; border-color:#cbd5e1;">
                        <label class="form-check-label" for="rememberCheck" style="font-size: 0.8rem; color:#475569;">Keep me signed in</label>
                    </div>
                    <a href="#" style="font-size: 0.75rem; color:#ff8c42; text-decoration: none; font-weight:500;">Forgot password?</a>
                </div>

                <!-- Login button with animated arrow -->
                <button type="submit" class="btn-material">
                    <span>Access Dashboard</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Sign up link section -->
            <div class="signup-cta">
                <a href="/myapp/signupclient_get/" class="signup-link">
                    <i class="fas fa-user-plus"></i> Create an account
                </a>
                <p class="mt-2 mb-0" style="font-size: 0.7rem; color:#6c7a91;">Join Material Hub — explore next-gen resources</p>
            </div>
        </div>
    </div>

    <!-- scripts for password toggle + subtle interactions and form client validation -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function(){
            // Password visibility toggle (material style)
            const toggleBtn = document.querySelector('.toggle-password');
            const passwordField = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if(toggleBtn && passwordField) {
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordField.setAttribute('type', type);
                    if(toggleIcon) {
                        if(type === 'text') {
                            toggleIcon.classList.remove('fa-eye-slash');
                            toggleIcon.classList.add('fa-eye');
                        } else {
                            toggleIcon.classList.remove('fa-eye');
                            toggleIcon.classList.add('fa-eye-slash');
                        }
                    }
                });
            }

            // Enhance placeholder behavior for material feel - but we already use label-badge
            // Also add floating input effect: highlight label on focus and blur
            const inputs = document.querySelectorAll('.form-control-material');
            inputs.forEach(input => {
                // On focus, add class to parent for better glow if needed, but already with box shadow.
                input.addEventListener('focus', function() {
                    const parentDiv = this.closest('.input-group-material');
                    if(parentDiv) {
                        const badge = parentDiv.querySelector('.label-badge');
                        if(badge) {
                            badge.style.color = '#ff8c42';
                            badge.style.fontWeight = '700';
                        }
                        const iconSpan = parentDiv.querySelector('.input-icon');
                        if(iconSpan) iconSpan.style.color = '#ff8c42';
                    }
                });
                input.addEventListener('blur', function() {
                    const parentDiv = this.closest('.input-group-material');
                    if(parentDiv) {
                        const badge = parentDiv.querySelector('.label-badge');
                        if(badge) {
                            badge.style.color = '#8e9aaf';
                            badge.style.fontWeight = '600';
                        }
                        const iconSpan = parentDiv.querySelector('.input-icon');
                        if(iconSpan && !this.value) iconSpan.style.color = '#8e9aaf';
                        else if(iconSpan) iconSpan.style.color = '#8e9aaf';
                    }
                });
                // Set initial state if value pre-filled (browser autofill)
                if(input.value.trim() !== "") {
                    const parentDiv = input.closest('.input-group-material');
                    if(parentDiv) {
                        const badge = parentDiv.querySelector('.label-badge');
                        if(badge) badge.style.color = '#ff8c42';
                    }
                }
            });

            // Additional demo: show a small live validation feedback (no backend, just prevent empty before submit)
            const form = document.getElementById('loginForm');
            const alertBox = document.getElementById('liveAlert');
            const alertMsgSpan = document.getElementById('alertMsg');

            form.addEventListener('submit', function(e) {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                if(username === "" || password === "") {
                    e.preventDefault();
                    if(alertBox) {
                        alertMsgSpan.innerText = "Please fill in both username and password to continue.";
                        alertBox.classList.remove('d-none');
                        alertBox.style.display = 'block';
                        setTimeout(() => {
                            alertBox.style.display = 'none';
                            alertBox.classList.add('d-none');
                        }, 3000);
                    } else {
                        alert("Username and password are required.");
                    }
                    return false;
                }
                // you could also add optional loading state but keep it simple
                const submitBtn = form.querySelector('button[type="submit"]');
                if(submitBtn) {
                    submitBtn.innerHTML = '<span>Signing in...</span> <i class="fas fa-spinner fa-pulse"></i>';
                    submitBtn.disabled = true;
                }
                // Form will submit normally; if any network error, it's fine.
                return true;
            });

            // for remember me checkbox styling (just visual no backend)
            const checkBox = document.getElementById('rememberCheck');
            if(checkBox) {
                // no functionality needed for this demo but we can store dummy
                checkBox.addEventListener('change', function() {
                    if(this.checked) {
                        // Optional: display toast but not necessary.
                        console.log("Remember me selected (UI only)");
                    }
                });
            }

            // for forgott password link -> dummy alert (non-intrusive)
            const forgotLink = document.querySelector('a[href="#"]');
            if(forgotLink && forgotLink.innerText.includes('Forgot')) {
                forgotLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    if(alertBox) {
                        alertMsgSpan.innerText = "🔐 Password reset link will be sent to your registered email (demo).";
                        alertBox.classList.remove('d-none');
                        alertBox.style.display = 'block';
                        setTimeout(() => {
                            alertBox.style.display = 'none';
                            alertBox.classList.add('d-none');
                        }, 3000);
                    } else {
                        alert("Demo: Password reset feature coming soon.");
                    }
                });
            }

            // Add subtle ripple effect on button (material touch)
            const btns = document.querySelectorAll('.btn-material');
            btns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    let ripple = document.createElement('span');
                    ripple.classList.add('ripple-effect');
                    const rect = btn.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = e.clientX - rect.left - size/2 + 'px';
                    ripple.style.top = e.clientY - rect.top - size/2 + 'px';
                    ripple.style.position = 'absolute';
                    ripple.style.borderRadius = '50%';
                    ripple.style.backgroundColor = 'rgba(255,255,255,0.4)';
                    ripple.style.transform = 'scale(0)';
                    ripple.style.transition = 'transform 0.4s ease-out';
                    ripple.style.pointerEvents = 'none';
                    btn.style.position = 'relative';
                    btn.style.overflow = 'hidden';
                    btn.appendChild(ripple);
                    setTimeout(() => {
                        ripple.style.transform = 'scale(4)';
                        ripple.style.opacity = '0';
                    }, 10);
                    setTimeout(() => {
                        if(ripple && ripple.remove) ripple.remove();
                    }, 400);
                });
            });

            // improve floating label behavior when inputs have autofill from browser
            setTimeout(() => {
                document.querySelectorAll('.form-control-material').forEach(inp => {
                    if(inp.value && inp.value.length > 0) {
                        const parentDiv = inp.closest('.input-group-material');
                        if(parentDiv) {
                            const badge = parentDiv.querySelector('.label-badge');
                            if(badge) badge.style.color = '#ff8c42';
                        }
                    }
                });
            }, 200);
        })();
    </script>
    <style>
        /* additional ripple effect style */
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255,255,240,0.5);
            transform: scale(0);
            animation: ripple-animation 0.5s linear forwards;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(6);
                opacity: 0;
            }
        }
        /* toggle button fine tune */
        .toggle-password {
            background: transparent;
            border: none;
            outline: none;
            transition: color 0.2s;
        }
        .toggle-password:hover {
            color: #ff8c42 !important;
        }
        .form-check-input:checked {
            background-color: #ff8c42;
            border-color: #ff8c42;
        }
        /* remove default input background for autocomplete */
        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            transition: background-color 0s 600000s, color 0s 600000s;
        }
        .form-control-material:focus + .label-badge,
        .form-control-material:not(:placeholder-shown) ~ .label-badge {
            color: #ff8c42;
        }
        /* placeholder trick for CSS only but we use js anyway */
        .form-control-material:placeholder-shown ~ .label-badge {
            color: #8e9aaf;
        }
    </style>
</body>
</html>
